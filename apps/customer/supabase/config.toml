# Isolated local 4IR test stack. Never link this directory to a hosted project.
project_id = "4ir-local-integration"
[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 56324
[auth]
enabled = true
site_url = "http://127.0.0.1:3102"
additional_redirect_urls = ["http://127.0.0.1:3102/auth/callback", "http://127.0.0.1:3102/auth/callback?flow=recovery"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"
[auth.rate_limit]
email_sent = 100
[storage]
enabled = false
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
